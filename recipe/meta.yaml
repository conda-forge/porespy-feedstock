{% set name = "porespy" %}
{% set version = "3.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7cdaf1baeff4ceafb2c767da06c11f446127504e20e42496d5fb23060f26d469

build:
  number: 0
  skip: true  # [py<311 or py>=314]
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - connected-components-3d
    - dask
    - deprecated
    - edt <3.1
    - imageio
    - matplotlib-base
    - matplotlib-inline >=0.1.7
    - numba
    - numpy
    - pandas
    - psutil
    - pyevtk >=1.6.0
    - pyvista >=0.46.4
    - rich
    - scikit-image >=0.25.0
    - scipy
    - setuptools
    - tomli >=2.2.1
    - tqdm

test:
  imports:
    - porespy

about:
  home: https://github.com/PMEAL/porespy/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A set of tools for characterizing and analying 3D images of porous materials
  description: PoreSpy is a collection of image analysis tool used to extract information from 3D images of porous materials (typically obtained from X-ray tomography). There are many packages that offer generalized image analysis tools (i.e Skimage and Scipy.NDimage in the Python environment, ImageJ, MatLab's Image 
    Processing Toolbox), but the all require building up complex scripts or macros to accomplish tasks of specific use to porous media. The aim of PoreSpy is to provide a set of pre-written tools for all the common porous media measurements.

  doc_url: https://porespy.org/
  dev_url: https://github.com/PMEAL/porespy/

extra:
  recipe-maintainers:
    - jgostick
    - ma-sadeghi
